name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter
        run: |
          flake8 src/ tests/ --max-line-length=100 --ignore=E501,W503

      - name: Run unit tests
        run: |
          pytest tests/ -v --ignore=tests/test_integration.py --tb=short

      - name: Run test coverage
        run: |
          pytest tests/ -v --ignore=tests/test_integration.py --cov=src --cov-report=term-missing

      - name: Run standalone test script
        run: |
          python tests/test_pipeline_script.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "black>=26.1" isort flake8

      - name: Check formatting with black
        run: black --check --line-length=100 src/ tests/

      - name: Check import sorting with isort
        run: isort --check-only --profile=black --line-length=100 src/ tests/
