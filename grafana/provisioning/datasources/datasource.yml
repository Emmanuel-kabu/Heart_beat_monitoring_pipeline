apiVersion: 1

datasources:
  - name: PostgreSQL - Heartbeat
    uid: heartbeat-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: heartbeat_db
    user: heartbeat_user
    secureJsonData:
      password: heartbeat_pass123
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: POST
      timeInterval: 10s
    isDefault: false
    editable: true
